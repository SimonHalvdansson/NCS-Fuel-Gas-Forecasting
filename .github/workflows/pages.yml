name: GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install data preparation dependencies
        run: python3 -m pip install -r scripts/requirements.txt
      - name: Run tests
        run: python3 -m unittest discover -s tests -v
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Rebuild history inputs
        run: |
          python3 scripts/build_history.py
          python3 scripts/build_reserves_history.py
      - name: Generate aggregate contribution summary
        run: python3 scripts/build_aggregate_contributors.py
      - name: Build website bundle
        run: python3 scripts/build_site.py
      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy web app
        id: deployment
        uses: actions/deploy-pages@v4
